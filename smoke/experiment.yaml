experiment:
  name: smoke
  description: "Minimal manifest for CI smoke testing"
  seed: 1

  population:
    size: 20
    archetypes:
      - name: stable
        proportion: 1.0
        skill_distribution: { type: normal, mean: 1000, stddev: 250 }
        skill_volatility: 0.0
        improvement_rate: 0.0
        play_frequency: 0.8
        session_length: 1800.0
        quit_probability: 0.0

  game:
    teams: { a: 1, b: 1 }
    script: plugins/game/logistic.lua
    beta: 400.0
    noise: 0.05

  matchmaking:
    script: plugins/matchmaking/batch.lua
    batch_interval: 1
    max_queue_time: 60.0

  rating:
    name: elo
    k_factor: 32.0
    initial_rating: 1000.0
    beta: 400.0

  metrics:
    - match_quality
    - queue_time
    - rating_accuracy

  cohorts: []

  duration:
    matches: 50
    max_time: 100.0

  output:
    directory: smoke/output/run
    formats: [json]
    plots: false
    report: false
