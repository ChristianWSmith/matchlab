name: smoke_optimize
base: experiment.yaml
seed: 1
budget: 2
search_space:
  parameters:
    experiment.rating.k_factor:
      type: float
      bounds: [1.0, 64.0]
objectives:
  - metric: match_quality
    direction: maximize
bo:
  initial_points: 1
  gp:
    phase1_restarts: 2
    phase2_restarts: 2
    phase2_inner_iters: 2
  k_dpp_candidates: 10
output:
  directory: output/optimize
