name: CI

on:
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Smoke test
        run: cargo run -- run experiments/v0_1_basic.yaml

      - name: Validate experiment YAML files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          failed=0
          for f in experiments/**/*.yaml experiments/*.yaml; do
            [ -f "$f" ] || continue
            if ! python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "FAILED: $f"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Some experiment YAML files have syntax errors"
            exit 1
          fi
          echo "All experiment YAML files validated"

      - name: Check documentation builds
        run: cargo doc --workspace --no-deps
