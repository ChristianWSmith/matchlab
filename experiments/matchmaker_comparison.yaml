base: base/standard.yaml

experiment:
  name: matchmaker_comparison
  description: "Batch vs ExpandingWindow vs Strict matchmakers on the same population"
  matchmaking:
    algorithm: expanding_window
    max_queue_time: 60.0
    tiers:
      - [5.0, 25.0]
      - [10.0, 50.0]
      - [20.0, 100.0]
      - [30.0, 200.0]
    max_window: 400.0
  metrics:
    - match_quality
    - queue_time
    - match_inequality