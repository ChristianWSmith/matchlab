experiment:
  name: development
  description: "Minimal confound population: single archetype, static skill, 1v1"
  seed: 42

  population:
    size: 500
    archetypes:
      - name: uniform
        proportion: 1.0
        skill_distribution: { type: normal, mean: 1000, stddev: 250 }
        skill_volatility: 0.0
        improvement_rate: 0.0
        play_frequency: 1.0
        session_length: 86400.0
        quit_probability: 0.0
        initial_rating: 1000.0

  game:
    teams: { a: 1, b: 1 }
    script: plugins/game/logistic.lua
    beta: 400.0
    noise: 0.0

  matchmaking:
    script: plugins/matchmaking/batch.lua
    batch_interval: 10
    max_queue_time: 60.0

  rating:
    script: plugins/rating/elo.lua
    k_factor: 32.0
    initial_rating: 1000.0
    beta: 400.0

  metrics:
    - rating_accuracy

  cohorts:
    - name: all
      filter: { type: all }

  duration:
    matches: 50000
    max_time: 604800.0

  output:
    directory: results/
    formats: [json]
    plots: false
    report: false
