experiment:
  name: golden_study
  description: "Comprehensive golden study exercising all subsystems"
  seed: 42

  population:
    size: 2000
    seed: 42
    archetypes:
      - name: stable
        proportion: 0.60
        skill_distribution: { type: normal, mean: 1000, stddev: 250 }
        skill_volatility: 5.0
        improvement_rate: 0.0
        play_frequency: 0.8
        session_length: 1800.0
        quit_probability: 0.01
      - name: improving
        proportion: 0.15
        skill_distribution: { type: normal, mean: 800, stddev: 200 }
        skill_volatility: 10.0
        improvement_rate: 2.0
        play_frequency: 0.9
        session_length: 2400.0
        quit_probability: 0.005
      - name: declining
        proportion: 0.10
        skill_distribution: { type: normal, mean: 1100, stddev: 150 }
        skill_volatility: 8.0
        improvement_rate: -1.5
        play_frequency: 0.5
        session_length: 1200.0
        quit_probability: 0.03
      - name: returning
        proportion: 0.10
        skill_distribution: { type: normal, mean: 1000, stddev: 200 }
        skill_volatility: 12.0
        improvement_rate: 1.0
        play_frequency: 0.6
        session_length: 1500.0
        quit_probability: 0.02
        initial_rating: 700
      - name: smurf
        proportion: 0.05
        skill_distribution: { type: normal, mean: 1500, stddev: 100 }
        skill_volatility: 5.0
        improvement_rate: 0.0
        play_frequency: 0.95
        session_length: 3600.0
        quit_probability: 0.002
        initial_rating: 700

  game:
    teams: { a: 5, b: 5 }
    script: plugins/game/logistic.lua
    beta: 400.0
    noise: 0.05

  matchmaking:
    script: plugins/matchmaking/batch.lua
    batch_interval: 10
    max_queue_time: 60.0

  rating:
    systems:
      - script: plugins/rating/elo.lua
        k_factor: 32.0
        initial_rating: 1000.0
        beta: 400.0

  detection:
    enabled: true
    script: plugins/detection/smurf.lua
    min_games_before_action: 3

  ranking:
    script: plugins/ranking/brackets.lua
    brackets:
      - { tier: iron, division: 1, min: 0, max: 600 }
      - { tier: bronze, division: 1, min: 600, max: 900 }
      - { tier: silver, division: 1, min: 900, max: 1200 }
      - { tier: gold, division: 1, min: 1200, max: 1500 }
      - { tier: platinum, division: 1, min: 1500, max: 1800 }
      - { tier: diamond, division: 1, min: 1800, max: 2100 }
      - { tier: radiant, division: 1, min: 2100, max: 100000 }

  satisfaction:
    enabled: true
    script: plugins/utility/satisfaction.lua
    match_quality: 1.0
    queue_time_penalty: -0.01
    win_bonus: 0.5
    loss_streak_penalty: -0.1
    rank_progression_bonus: 0.2
    fairness_sensitivity: 0.0
    rematch_bonus: 0.1

  metrics:
    - match_quality
    - queue_time
    - rating_accuracy
    - match_inequality
    - ndcg
    - dimensionality_fidelity
    - convergence
    - responsiveness
    - stability
    - streaks
    - population_health
    - smurf

  objectives:
    match_quality: 1.0
    queue_time: 0.5
    rating_accuracy: 1.0
    convergence_speed: 0.8
    smurf_damage: 2.0
    false_positive_rate: 1.5
    streak_frustration: 0.3

  cohorts: []

  duration:
    matches: 5000
    max_time: 604800.0

  output:
    directory: results/
    formats: [json]
    plots: false
    report: true
