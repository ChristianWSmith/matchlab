base: base/standard.yaml

experiment:
  name: detection_test
  description: "Smurf detection on a population with a smurf archetype"
  detection:
    enabled: true
    script: plugins/detection/smurf.lua
    min_games_before_action: 3
  metrics:
    - match_quality
    - queue_time
    - rating_accuracy
    - smurf