base: base/standard.yaml

experiment:
  name: lua_hooks_test
  description: "Lua-hooked Elo rating with dynamic K factor"
  rating:
    systems:
      - name: lua:elo
        script: plugins/rating/dynamic_elo.lua
        k_factor: 32.0
        initial_rating: 1000.0
        beta: 400.0
  matchmaking:
    algorithm: batch
    batch_interval: 10
    max_queue_time: 60.0
  metrics:
    - match_quality
    - queue_time
    - rating_accuracy