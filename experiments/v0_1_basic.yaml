experiment:
  name: v0_1_basic
  description: "Minimal Elo test with static skill population"
  seed: 42

  population:
    size: 10000
    seed: 42
    archetypes:
      - name: stable
        proportion: 1.0
        skill_distribution: { type: normal, mean: 1000, stddev: 250 }
        skill_volatility: 0.0
        improvement_rate: 0.0
        play_frequency: 0.8
        session_length: 1800.0
        quit_probability: 0.0

  game:
    team_size: 5
    outcome_model: logistic
    beta: 400.0
    noise: 0.05

  matchmaking:
    algorithm: batch
    batch_interval: 10
    max_queue_time: 60.0

  rating:
    systems:
      - name: elo
        k_factor: 32.0
        initial_rating: 1000.0
        beta: 400.0

  metrics:
    - match_quality
    - queue_time
    - rating_accuracy

  cohorts:
    - name: all
      filter: { type: all }

  duration:
    matches: 1000000
    max_time: 604800.0

  output:
    directory: results/
    formats: [json]
    plots: false
    report: false
