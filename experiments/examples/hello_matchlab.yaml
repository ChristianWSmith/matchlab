experiment:
  name: hello_matchlab
  description: "Minimal getting-started experiment: 100 players, 100 matches, flat skill"
  seed: 42

  population:
    size: 100
    seed: 42
    archetypes:
      - name: casual
        proportion: 1.0
        skill_distribution: { type: normal, mean: 1000, stddev: 200 }
        skill_volatility: 0.0
        improvement_rate: 0.0
        play_frequency: 0.8
        session_length: 1800.0
        quit_probability: 0.0
        initial_rating: 1000.0

  game:
    teams: { a: 1, b: 1 }
    script: plugins/game/logistic.lua
    beta: 400.0
    noise: 0.05

  matchmaking:
    script: plugins/matchmaking/batch.lua
    batch_interval: 10
    max_queue_time: 60.0

  rating:
    systems:
      - name: elo
        k_factor: 32.0
        initial_rating: 1000.0
        beta: 400.0

  metrics:
    - match_quality
    - queue_time
    - rating_accuracy

  cohorts: []

  duration:
    matches: 100
    max_time: 604800.0

  output:
    directory: results/
    formats: [json]
    plots: false
    report: false
