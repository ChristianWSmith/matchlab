base: ../base/standard.yaml

experiment:
  name: feedback_elo_expanding
  description: "feedback-loop cell: elo x expanding-window matchmaking"
  matchmaking:
    script: plugins/matchmaking/expanding_window.lua
    batch_interval: 10
    max_queue_time: 60.0
    tiers:
      - [5.0, 25.0]
      - [10.0, 50.0]
      - [20.0, 100.0]
      - [30.0, 200.0]
    max_window: 400.0
  rating:
    systems:
      - name: elo
        k_factor: 32.0
        initial_rating: 1000.0
        beta: 400.0