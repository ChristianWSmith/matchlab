base: ../base/standard.yaml

experiment:
  name: feedback_trueskill_expanding
  description: "feedback-loop cell: trueskill x expanding-window matchmaking"
  matchmaking:
    script: plugins/matchmaking/expanding_window.lua
    batch_interval: 10
    max_queue_time: 60.0
    tiers:
      - [5.0, 25.0]
      - [10.0, 50.0]
      - [20.0, 100.0]
      - [30.0, 200.0]
    max_window: 400.0
  rating:
    systems:
      - name: trueskill
        initial_rating: 1000.0
        initial_variance: 122500.0
        beta: 400.0
        dynamics: 0.0
        draw_probability: 0.1