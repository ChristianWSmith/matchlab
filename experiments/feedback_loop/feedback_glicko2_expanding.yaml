base: ../base/standard.yaml

experiment:
  name: feedback_glicko2_expanding
  description: "feedback-loop cell: glicko2 x expanding-window matchmaking"
  matchmaking:
    script: plugins/matchmaking/expanding_window.lua
    batch_interval: 10
    max_queue_time: 60.0
    tiers:
      - [5.0, 25.0]
      - [10.0, 50.0]
      - [20.0, 100.0]
      - [30.0, 200.0]
    max_window: 400.0
  rating:
    systems:
      - name: glicko2
        initial_rating: 1000.0
        initial_rd: 350.0
        initial_volatility: 0.06
        tau: 0.5
        epsilon: 0.000001