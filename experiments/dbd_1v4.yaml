experiment:
  name: dbd_1v4
  description: "Dead-by-Daylight-style 1v4: one killer vs four survivors, role-gated matchmaking"
  seed: 42

  population:
    size: 1000
    seed: 42
    archetypes:
      - name: killer
        proportion: 0.18
        skill_distribution: { type: normal, mean: 1250, stddev: 250 }
        skill_volatility: 5.0
        improvement_rate: 0.0
        play_frequency: 0.9
        session_length: 2400.0
        quit_probability: 0.005
        initial_rating: 1200.0
        role: killer
      - name: survivor
        proportion: 0.82
        skill_distribution: { type: normal, mean: 1000, stddev: 100 }
        skill_volatility: 5.0
        improvement_rate: 0.0
        play_frequency: 0.7
        session_length: 1800.0
        quit_probability: 0.01
        initial_rating: 1000.0
        role: survivor

  game:
    teams: { a: { size: 1, role: killer }, b: { size: 4, role: survivor } }
    script: plugins/game/logistic.lua
    beta: 400.0
    noise: 0.05

  matchmaking:
    script: plugins/matchmaking/batch.lua
    batch_interval: 10
    max_queue_time: 60.0

  rating:
    systems:
      - script: plugins/rating/elo.lua
        k_factor: 32.0
        initial_rating: 1000.0
        beta: 400.0

  metrics:
    - match_quality
    - queue_time
    - rating_accuracy

  cohorts: []

  duration:
    matches: 20000
    max_time: 7200.0

  output:
    directory: results/
    formats: [json]
    plots: false
    report: false